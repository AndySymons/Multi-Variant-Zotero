<div id="mvz-settings-root">
	<div class="mvz-tab-bar">
		<button type="button" class="mvz-tab-button" data-tab="targetDocument" data-mvz-l10n="MVZ_TAB_TARGET_DOCUMENT"></button>
		<button type="button" class="mvz-tab-button" data-tab="fieldInclusion" data-mvz-l10n="MVZ_TAB_FIELD_INCLUSION"></button>
		<button type="button" class="mvz-tab-button" data-tab="scriptLanguageLists" data-mvz-l10n="MVZ_TAB_SCRIPT_LANGUAGE_LISTS"></button>
	</div>

	<div class="mvz-tab-panel" data-tab-panel="targetDocument">
		<section>
			<label data-mvz-l10n="MVZ_TARGET_LANGUAGE_LABEL"></label>
			<span id="mvz-target-language-value"></span>
			<button type="button" id="mvz-target-language-change" data-mvz-l10n="MVZ_CHANGE_BUTTON"></button>
		</section>

		<section>
			<h3 data-mvz-l10n="MVZ_STYLE_SECTION_LABEL"></h3>
			<div class="mvz-style-options">
				<label><input type="radio" name="mvz-style" value="apa" /> <span data-mvz-l10n="MVZ_STYLE_OPTION_APA"></span></label>
				<label><input type="radio" name="mvz-style" value="cmos" /> <span data-mvz-l10n="MVZ_STYLE_OPTION_CMOS"></span></label>
				<label><input type="radio" name="mvz-style" value="mla" /> <span data-mvz-l10n="MVZ_STYLE_OPTION_MLA"></span></label>
				<label><input type="radio" name="mvz-style" value="mhra" /> <span data-mvz-l10n="MVZ_STYLE_OPTION_MHRA"></span></label>
				<label><input type="radio" name="mvz-style" value="custom" /> <span data-mvz-l10n="MVZ_STYLE_OPTION_CUSTOM"></span></label>
			</div>
			<label data-mvz-l10n="MVZ_INCLUDE_ORIGINAL_LABEL"></label>
			<div class="mvz-style-options">
				<label><input type="radio" name="mvz-include-original" value="true" /> <span data-mvz-l10n="MVZ_INCLUDE_ORIGINAL_YES"></span></label>
				<label><input type="radio" name="mvz-include-original" value="false" /> <span data-mvz-l10n="MVZ_INCLUDE_ORIGINAL_NO"></span></label>
			</div>
			<div id="mvz-custom-template-fields" hidden="hidden">
				<label data-mvz-l10n="MVZ_STYLE_CUSTOM_STANDALONE_LABEL"></label>
				<textarea id="mvz-custom-standalone"></textarea>
				<label data-mvz-l10n="MVZ_STYLE_CUSTOM_CONTAINED_LABEL"></label>
				<textarea id="mvz-custom-contained"></textarea>
			</div>
		</section>
	</div>

	<div class="mvz-tab-panel" data-tab-panel="fieldInclusion" hidden="hidden">
		<table id="mvz-field-matrix">
			<thead>
				<tr>
					<th data-mvz-l10n="MVZ_FIELD_MATRIX_COL_FIELD"></th>
					<th data-mvz-l10n="MVZ_FIELD_MATRIX_COL_ORIGINAL"></th>
					<th data-mvz-l10n="MVZ_FIELD_MATRIX_COL_TRANSLITERATION"></th>
					<th data-mvz-l10n="MVZ_FIELD_MATRIX_COL_TRANSLATION"></th>
				</tr>
			</thead>
			<tbody id="mvz-field-matrix-body"></tbody>
		</table>
	</div>

	<div class="mvz-tab-panel" data-tab-panel="scriptLanguageLists" hidden="hidden">
		<div class="mvz-shortlist-preferences">
			<section>
				<label data-mvz-l10n="MVZ_SHORTLIST_L_LABEL"></label>
				<div id="mvz-language-shortlist"></div>
			</section>
			<section>
				<label data-mvz-l10n="MVZ_SHORTLIST_S_LABEL"></label>
				<div id="mvz-script-shortlist"></div>
			</section>
		</div>
	</div>
</div>
